name: Refresh GATE RADAR industry news

on:
  schedule:
    # GitHub schedules are approximate, and may run later than requested.
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'data/curated.json'
      - '.github/workflows/news.yml'

permissions:
  contents: write   # retain latest feed in repository (also triggers Netlify Git deploys)
  pages: write
  id-token: write

concurrency:
  group: gate-radar-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Collect targeted UK / EMEA / US headlines
        env:
          GATE_TARGET_AGENCIES: ${{ secrets.GATE_TARGET_AGENCIES }}
        run: python scripts/collect_news.py
      - name: Save latest feed to repository for future runs and Netlify
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh industry headlines [skip ci]"
            # Incorporate any changes made during news collection before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Publish refreshed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4